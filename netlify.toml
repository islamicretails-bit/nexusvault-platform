[build]
  command = "npm run build"
  publish = "apps/web/dist"

[functions]
  directory = "apps/web/functions"

[env]
  NEXUSVAULT_ENV = "production"
  NEXUSVAULT_API_URL = "https://api.nexusvault.io"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

[[headers]]
  for = "/_next/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[context.production]
  command = "npm run build:production"
  [context.production.env]
    NEXUSVAULT_ENV = "production"
    NEXUSVAULT_API_URL = "https://api.nexusvault.io"

[context.staging]
  command = "npm run build:staging"
  [context.staging.env]
    NEXUSVAULT_ENV = "staging"
    NEXUSVAULT_API_URL = "https://staging-api.nexusvault.io"

[context.development]
  command = "npm run build:development"
  [context.development.env]
    NEXUSVAULT_ENV = "development"
    NEXUSVAULT_API_URL = "https://localhost:8080"